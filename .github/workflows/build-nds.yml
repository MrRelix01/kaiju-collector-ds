name: Build Kaiju Collector Boot Test ROM

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ROM
        run: |
          make clean
          make

      - name: Verify ROM output
        run: |
          test -f kaiju_collector_boot_test.nds
          test -s kaiju_collector_boot_test.nds

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaiju-collector-boot-test
          path: kaiju_collector_boot_test.nds
          if-no-files-found: error
